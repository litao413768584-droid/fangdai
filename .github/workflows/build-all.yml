name: Build Tauri App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "v${{ github.ref_name }}"
          body: "自动打包的安装包"
          draft: false
          prerelease: false
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'  # 从 17 改为 21

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装项目依赖
        run: |
          npm install
          npm install -D @tailwindcss/postcss postcss autoprefixer

      - name: 构建 Android APK
        run: |
          npm run build
          npx cap add android
          npx cap sync
          npx cap open android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 Android APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-app
          path: android/app/build/outputs/apk/debug/*.apk