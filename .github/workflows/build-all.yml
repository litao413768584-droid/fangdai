name: 自动构建 Windows EXE 与 Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. 构建 Windows 超轻量 EXE (Tauri v2)
  # ==========================================
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Create valid icon.ico
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(64, 64)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::RoyalBlue)
          $g.DrawString("房贷", (New-Object System.Drawing.Font("Arial",16)), [System.Drawing.Brushes]::White, 5, 20)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          New-Item -ItemType Directory -Force -Path "src-tauri/icons" | Out-Null
          $fs = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          $icon.Save($fs)
          $fs.Close()
        shell: powershell

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri EXE
        run: npx tauri build

      - name: Collect Windows EXE
        shell: bash
        run: |
          mkdir -p ./output-exe
          find src-tauri/target/release/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} ./output-exe/ \; 2>/dev/null || true

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fangdai-windows-exe
          path: ./output-exe/*

  # ==========================================
  # 2. 构建 Android APK (Capacitor 原生安卓包)
  # ==========================================
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build frontend
        run: npm run build

      - name: Initialize and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          cat << 'EOF' >> android/app/build.gradle

          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
                  }
              }
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fangdai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
