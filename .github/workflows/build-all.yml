name: 自动同时打包 EXE 和 APK (Release Workflow)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 1. 构建 Windows 桌面端 EXE (基于 Tauri 2.0 超小体积版)
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装 Rust 工具链 (Tauri 必备)
        uses: dtolnay/rust-toolchain@stable

      - name: 安装项目依赖
        run: npm ci

      - name: 编译构建 Web 前端产物
        run: npm run build

      - name: 使用 Tauri 打包 Windows EXE
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: build-temp
          releaseName: '临时构建'
          releaseDraft: true
          prerelease: true

      - name: 上传 Windows EXE 构件
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-app
          path: src-tauri/target/release/bundle/nsis/*.exe

  # 2. 构建 Android 移动端 APK (基于 Capacitor + Gradle)
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 安装项目依赖
        run: npm ci

      - name: 构建 Web 前端静态资源
        run: npm run build

      - name: 初始化并同步 Android Capacitor 工程
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 赋予 Gradle 执行权限并编译 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 Android APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 3. 自动归档发布合并 GitHub Release (包含 EXE 与 APK)
  create-release:
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 Windows EXE 构件
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-app
          path: ./release-exe

      - name: 下载 Android APK 构件
        uses: actions/download-artifact@v4
        with:
          name: android-apk-app
          path: ./release-apk

      - name: 整理并重命名构件名称
        run: |
          mkdir -p ./release-final
          cp ./release-exe/*.exe ./release-final/Fangdai-Sandbox-Desktop-Setup.exe || true
          cp ./release-apk/app-debug.apk ./release-final/Fangdai-Sandbox-Mobile.apk || true

      - name: 发布至 GitHub Release (包含双平台安装包)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: ./release-final/*
          name: 房贷提前还款分析沙盒 Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            🎉 **跨平台应用双端合并发布！**

            本版本同时提供 Windows 桌面端和 Android 移动端安装包：
            - 🖥️ **Windows 桌面端**：`Fangdai-Sandbox-Desktop-Setup.exe` (基于 Tauri 2.0 极简架构，体积仅 5MB~10MB)
            - 📱 **Android 移动端**：`Fangdai-Sandbox-Mobile.apk` (基于 Capacitor 原生容器)

            无需安装任何环境，下载双击/安装即可使用。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传打包合并产物至 Actions Artifacts (方便直接页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: Fangdai-Sandbox-EXE-and-APK
          path: ./release-final/*
