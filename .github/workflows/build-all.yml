name: 自动同时打包 EXE 和 APK (Release Workflow)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. 构建 Windows 桌面端 EXE (基于 Tauri 2.0 超小体积版)
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust 工具链 (Tauri 必备)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装项目依赖
        run: npm install

      - name: 编译构建 Web 前端静态资源
        run: npm run build

      - name: 设置版本标签
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: 使用 Tauri 打包 Windows EXE
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: '${{ env.TAG_NAME }}'
          releaseName: '房贷提前还款分析沙盒 Release ${{ env.TAG_NAME }}'
          releaseDraft: true
          prerelease: false

      - name: 上传 Windows EXE 构件
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-app
          path: src-tauri/target/release/bundle/**/*.exe

  # 2. 构建 Android 移动端 APK (基于 Capacitor + Gradle)
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 配置 Java JDK 21 (Capacitor 必需)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Android SDK 环境
        uses: android-actions/setup-android@v3

      - name: 安装项目依赖
        run: npm install

      - name: 构建 Web 前端静态资源
        run: npm run build

      - name: 初始化 Capacitor 并同步 Android 工程
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 编译 Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 上传 Android APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-app
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 3. 自动归档发布合并 GitHub Release (包含 EXE 与 APK)
  create-release:
    needs: [build-windows-exe, build-android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 Windows EXE 构件
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-app
          path: ./release-exe

      - name: 下载 Android APK 构件
        uses: actions/download-artifact@v4
        with:
          name: android-apk-app
          path: ./release-apk

      - name: 整理并重命名构件文件
        run: |
          mkdir -p ./release-final
          cp ./release-exe/*.exe ./release-final/Fangdai-Sandbox-Desktop-Setup.exe || cp ./release-exe/*/*.exe ./release-final/Fangdai-Sandbox-Desktop-Setup.exe || true
          cp ./release-apk/app-debug.apk ./release-final/Fangdai-Sandbox-Mobile.apk || true

      - name: 设置版本标签
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: 发布至 GitHub Release (包含双平台安装包)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: '${{ env.TAG_NAME }}'
          files: ./release-final/*
          name: '房贷提前还款分析沙盒 Release ${{ env.TAG_NAME }}'
          body: |
            🎉 **跨平台应用双端合并发布！**

            本版本同时提供 Windows 桌面端和 Android 移动端安装包：
            - 🖥️ **Windows 桌面端**：`Fangdai-Sandbox-Desktop-Setup.exe` (基于 Tauri 2.0 极简架构，体积仅 5MB~10MB)
            - 📱 **Android 移动端**：`Fangdai-Sandbox-Mobile.apk` (基于 Capacitor 原生容器)

            无需安装任何环境，下载双击/安装即可使用。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传打包合并产物至 Actions Artifacts (方便直接页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: Fangdai-Sandbox-EXE-and-APK
          path: ./release-final/*
